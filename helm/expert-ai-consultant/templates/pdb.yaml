{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "expert-ai-consultant.fullname" . }}-pdb
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "expert-ai-consultant.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: {{ .Values.app }}
{{- end }}
