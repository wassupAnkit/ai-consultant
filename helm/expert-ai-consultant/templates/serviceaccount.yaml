{{- if .Values.serviceAccount.create }}
# Edge's own pod identity. Its IRSA role (heubert-infra environments/prod/
# expert-ai-consultant-irsa.tf) grants Bedrock for bedrock: models and the
# secrets-store CSI read of prod/expert-ai-consultant/*, which the API and the
# ingest CronJobs both need: a pod can assume only its own SA's role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app }}
  {{- with .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . }}
  {{- end }}
{{- end }}
